<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOLT · 项目树 · 对话回放</title>
<style>
  :root {
    color-scheme: light;
    --paper: #FCFCFD;
    --paper-2: #F4F5F7;
    --ink: #14161A;
    --ink-2: #3A4048;
    --ink-3: #6B7280;
    --line: #E6E8EC;
    --red: #C0392B;
    --indigo: #1B4D8F;
    --gold: #B98A2F;
    --green: #1E7A46;
    --violet: #7D6AA8;
    --font-display: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --font-body: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-num: "SF Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 8% -10%, rgba(27,77,143,.055), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(185,138,47,.06), transparent 55%),
      var(--paper);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font: inherit; }

  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 6px clamp(12px, 1.6vw, 24px) 6px;
    overflow: hidden;
  }

  /* ---------- 紧凑页头（≤72px） ---------- */
  .top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    gap: 10px 14px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 7px;
    min-width: 0;
    white-space: nowrap;
  }
  .kicker {
    margin: 0;
    color: var(--indigo);
    font: 600 .52rem var(--font-num);
    letter-spacing: .12em;
  }
  .brand-title {
    font: 600 .88rem/1 var(--font-display);
    letter-spacing: -.01em;
  }
  .top-mid { min-width: 0; text-align: center; }
  .tabs {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(255,255,255,.72);
  }
  .tab {
    padding: 4px 10px;
    border: 0;
    border-radius: 3px;
    color: var(--ink-3);
    background: transparent;
    font: 500 .69rem var(--font-body);
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--indigo); background: #F3F6FA; box-shadow: inset 0 0 0 1px #DCE5EF; }
  .top-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    min-width: 0;
  }
  .meta {
    margin: 0;
    color: var(--ink-3);
    font: .54rem var(--font-num);
    letter-spacing: .02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .current-chip {
    display: flex;
    align-items: baseline;
    gap: 5px;
    padding: 3px 8px;
    border: 1px solid #C9D4E2;
    border-radius: 4px;
    background: #F6F9FC;
    color: var(--indigo);
    white-space: nowrap;
  }
  .current-chip span { font: 600 .51rem var(--font-num); letter-spacing: .1em; }
  .current-chip b { font: 600 .92rem var(--font-num); letter-spacing: -.02em; }
  .close-button {
    height: 26px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink-2);
    font: 500 .62rem var(--font-body);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .18s ease, color .18s ease;
  }
  .close-button:hover { border-color: var(--indigo); color: var(--indigo); }

  /* ---------- 三栏工作区 ---------- */
  .workspace {
    position: relative;
    display: grid;
    grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr) 360px;
    gap: 10px;
    flex: 1;
    min-height: 0;
    padding-top: 6px;
  }
  .column {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    min-height: 0;
  }
  .tree-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    min-height: 24px;
    padding: 0 2px;
    flex: 0 0 auto;
  }
  .tree-title { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .eyebrow {
    margin: 0;
    color: var(--indigo);
    font: 600 .5rem var(--font-num);
    letter-spacing: .1em;
    white-space: nowrap;
  }
  .tree-head h2 {
    margin: 0;
    font: 600 .82rem/1.1 var(--font-display);
    white-space: nowrap;
  }
  .tree-chip {
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: rgba(255,255,255,.72);
    color: var(--ink-3);
    font: 500 .52rem var(--font-num);
    white-space: nowrap;
  }
  .tree-chip.is-current { color: var(--indigo); border-color: #C9D4E2; background: #F6F9FC; }
  .config-head-right { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }

  /* 泳道标题：固定在树顶部，随横向滚动同步 */
  .lane-head {
    position: relative;
    flex: 0 0 22px;
    height: 22px;
    overflow: hidden;
    border-bottom: 1px solid var(--line);
    background: rgba(252,252,253,.94);
  }
  .lane-head-track {
    position: absolute;
    left: 14px;
    top: 0;
    height: 100%;
    will-change: transform;
  }
  .lane-head-label {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    color: var(--ink-3);
    font: 600 .55rem var(--font-num);
    letter-spacing: .02em;
    white-space: nowrap;
  }

  .viewport {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background-color: rgba(255,255,255,.58);
    background-image:
      linear-gradient(rgba(27,77,143,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,77,143,.045) 1px, transparent 1px);
    background-size: 22px 22px;
    overflow: hidden;
  }
  .tree-scroll {
    position: absolute;
    inset: 0;
    overflow: auto;
    padding: 0 14px 24px;
    scrollbar-width: thin;
    scrollbar-color: #C9D2DC transparent;
  }
  .tree-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .tree-scroll::-webkit-scrollbar-thumb { background: #CDD5DE; border-radius: 4px; }
  .tree-scroll::-webkit-scrollbar-track { background: transparent; }
  .graph-svg { display: block; margin: 0; opacity: 0; transition: opacity .2s ease; }
  .graph-svg.is-visible { opacity: 1; }

  /* ---------- SVG 图 ---------- */
  .lane-band { fill: rgba(244,245,247,.42); }
  .lane-band.alt { fill: rgba(255,255,255,0); }
  .edge { fill: none; stroke: #9AA6B4; stroke-width: 1.1; opacity: .62; }
  .edge.is-branch { stroke-dasharray: 4 3; opacity: .8; }
  .edge.is-rollback { stroke: var(--red); }
  .edge.is-experiment { stroke: var(--gold); }

  .graph-node { cursor: pointer; outline: none; }
  .graph-node .node-card {
    fill: #fff;
    stroke: #DDE2E8;
    stroke-width: 1;
    transition: fill .15s ease, stroke .15s ease;
  }
  .graph-node:hover .node-card { stroke: #B9C7D6; }
  .graph-node:focus-visible .node-card { stroke: var(--indigo); stroke-width: 2.2; }
  .graph-node.is-config-match .node-card { fill: #FBF9FE; stroke: #B9A9D6; stroke-width: 1.5; }
  .graph-node.is-linked .node-card { stroke: var(--violet); stroke-width: 1.8; }
  .graph-node.is-selected .node-card { fill: #F3F7FC; stroke: var(--indigo); stroke-width: 2.2; }
  .config-node.is-selected .node-card { fill: #F7F4FC; stroke: var(--violet); stroke-width: 2.4; }
  .graph-node.is-current .node-card { fill: #F7FAFD; stroke: var(--indigo); stroke-width: 2.6; }
  .config-node.is-current .node-card { stroke: var(--indigo); }
  .graph-node.is-current.is-selected .node-card { stroke-width: 3; }
  .graph-node.is-new { animation: node-in .3s ease both; }
  @keyframes node-in { from { opacity: 0; } to { opacity: 1; } }
  .node-line { fill: var(--ink); font-family: var(--font-num); font-size: 9px; font-weight: 600; }
  .node-line.sub { fill: var(--ink-3); font-size: 8px; font-weight: 400; }
  .node-dot { fill: var(--indigo); }
  .merge-badge { fill: var(--violet); }
  .merge-badge-text {
    fill: #fff;
    font-family: var(--font-num);
    font-size: 6.5px;
    font-weight: 600;
    text-anchor: middle;
    letter-spacing: .02em;
  }

  /* ---------- 详情栏 ---------- */
  .detail-column {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: rgba(255,255,255,.84);
    box-shadow: 0 12px 32px rgba(20,22,26,.04);
    overflow: hidden;
  }
  .detail-head {
    flex: 0 0 auto;
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
  }
  .detail-kicker { margin: 0; color: var(--indigo); font: 600 .55rem var(--font-num); letter-spacing: .12em; }
  .detail-column.is-config .detail-kicker { color: var(--violet); }
  .detail-title {
    margin: 4px 0 0;
    font: 600 .98rem/1.28 var(--font-display);
    overflow-wrap: anywhere;
  }
  .detail-facts {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 3px 12px;
    margin: 6px 0 0;
    padding: 0;
  }
  .detail-facts > div { display: flex; gap: 5px; min-width: 0; }
  .detail-facts dt {
    margin: 0;
    color: var(--ink-3);
    font: 500 .58rem var(--font-num);
    white-space: nowrap;
  }
  .detail-facts dd {
    margin: 0;
    color: var(--ink-2);
    font: 500 .58rem var(--font-num);
    overflow-wrap: anywhere;
  }
  .detail-config {
    margin: 6px 0 0;
    padding: 4px 7px;
    border-left: 2px solid var(--violet);
    border-radius: 0 3px 3px 0;
    background: #F8F6FC;
    color: #5B4B7D;
    font: .58rem/1.5 var(--font-num);
    overflow-wrap: anywhere;
  }
  .detail-note {
    margin: 5px 0 0;
    color: var(--ink-3);
    font: .58rem/1.5 var(--font-body);
  }
  .detail-notice {
    margin: 5px 0 0;
    padding: 4px 7px;
    border-left: 2px solid var(--gold);
    background: #FDFAF3;
    color: #8A6A1F;
    font-size: .58rem;
    line-height: 1.5;
  }
  .detail-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 9px 12px 12px;
    display: flex;
    flex-direction: column;
  }
  .detail-empty { margin: 0; padding: 8px 2px; color: var(--ink-3); font-size: .7rem; line-height: 1.65; }
  .detail-log { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; justify-content: flex-start; }
  .detail-log.is-spread { justify-content: space-between; }
  .detail-loading { margin: 0; color: var(--ink-3); font: .58rem var(--font-num); letter-spacing: .03em; }

  .msg { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .msg-role { margin: 0; color: var(--ink-3); font: 600 .52rem var(--font-num); letter-spacing: .08em; }
  .msg-body {
    margin: 0;
    max-width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink-2);
    font-size: .69rem;
    line-height: 1.62;
    overflow-wrap: anywhere;
  }
  .msg.user .msg-role { color: var(--indigo); }
  .msg.user .msg-body { border-color: #D7E1ED; background: #F6F9FC; }
  .msg.assistant .msg-role { color: var(--green); }
  .msg.assistant .msg-body { background: #fff; border-color: var(--line); }
  .msg.tool .msg-role { color: var(--gold); }
  .msg.tool .msg-body {
    padding: 4px 7px;
    border: 0;
    border-left: 2px solid rgba(185,138,47,.6);
    border-radius: 0 3px 3px 0;
    background: rgba(244,245,247,.8);
    color: var(--ink-3);
    font: .57rem/1.55 var(--font-num);
  }
  .msg.pending .msg-body { color: var(--ink-3); }
  .dots { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .detail-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  .detail-status { margin: 0; color: var(--ink-3); font: .57rem var(--font-num); line-height: 1.5; }
  .detail-status.is-done { color: var(--green); }

  .rollback-btn {
    height: 30px;
    padding: 0 10px;
    border: 1px solid #C9D4E2;
    border-radius: 4px;
    background: #F6F9FC;
    color: var(--indigo);
    font: 500 .65rem var(--font-body);
    white-space: nowrap;
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, color .18s ease;
  }
  .rollback-btn:hover { border-color: var(--indigo); }
  .rollback-btn.is-armed { border-color: #D9A7A1; background: #FDF6F5; color: var(--red); }
  .rollback-btn:disabled { opacity: .55; cursor: default; }

  /* ---------- 配置清单（正常文档流） ---------- */
  .manifest { display: flex; flex-direction: column; gap: 2px; }
  .manifest-row {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr);
    gap: 8px;
    padding: 5px 0;
    border-top: 1px dashed var(--line);
  }
  .manifest-row:first-child { border-top: 0; }
  .manifest-key { color: var(--ink-3); font: 600 .55rem var(--font-num); letter-spacing: .05em; }
  .manifest-items { display: flex; flex-wrap: wrap; gap: 3px 5px; min-width: 0; }
  .manifest-item {
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 2px;
    background: #fff;
    color: var(--ink-2);
    font: .56rem var(--font-num);
  }
  .manifest-item.is-add { color: var(--green); border-color: #CFE3D6; background: #F4FAF6; }
  .manifest-item.is-remove { color: var(--red); border-color: #E8D0CC; background: #FDF7F6; }
  .manifest-item.is-same { color: var(--ink-3); background: #FAFBFC; }
  .manifest-empty { color: var(--ink-3); font: .58rem var(--font-num); }
  .config-diff { margin: 8px 0 0; color: var(--ink-3); font: .57rem/1.6 var(--font-num); }
  .config-bindings {
    margin: 9px 0 0;
    padding-top: 7px;
    border-top: 1px solid var(--line);
    color: var(--ink-3);
    font-size: .62rem;
    line-height: 1.65;
    overflow-wrap: anywhere;
  }
  .config-bindings b { color: var(--ink-2); }

  /* ---------- 页脚 ---------- */
  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 2px 16px;
    padding-top: 5px;
    color: var(--ink-3);
    font-size: .54rem;
    line-height: 1.5;
    flex: 0 0 auto;
  }
  .foot b { color: var(--ink-2); font-weight: 600; }

  /* ---------- 加载遮罩 ---------- */
  .loading {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(252,252,253,.9);
    backdrop-filter: blur(2px);
  }
  .loading[hidden] { display: none; }
  .loading p { margin: 0; color: var(--ink-3); font: .63rem var(--font-num); letter-spacing: .05em; }
  .spinner {
    width: 18px;
    height: 18px;
    border: 1.5px solid #D5DCE5;
    border-top-color: var(--indigo);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- iframe 嵌入 ---------- */
  html.embed body { overflow: hidden; }
  html.embed .page { height: 100vh; padding: 6px 10px 4px; }
  html.embed .foot { display: none; }
  html.embed .workspace { padding-top: 6px; }

  /* ---------- <1200px：详情栏下移，两树并排 ---------- */
  @media (max-width: 1200px) {
    .workspace {
      grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr);
      grid-template-rows: minmax(0, 1fr) 300px;
    }
    .session-column { grid-column: 1; grid-row: 1; }
    .config-column { grid-column: 2; grid-row: 1; }
    .detail-column { grid-column: 1 / -1; grid-row: 2; height: 300px; min-height: 300px; }
  }

  /* ---------- <860px：单列堆叠，树高 420px ---------- */
  @media (max-width: 860px) {
    body { overflow: auto; overflow-x: hidden; }
    .page { height: auto; min-height: 100vh; padding: 9px 12px; overflow: visible; }
    .top { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
    .brand { grid-column: 1; grid-row: 1; }
    .top-mid { grid-column: 1 / -1; grid-row: 2; text-align: left; }
    .top-mid .tabs { width: 100%; }
    .tab { flex: 1; }
    .top-right { grid-column: 2; grid-row: 1; }
    .top-right .meta { display: none; }
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 420px 420px 300px;
      overflow: visible;
      min-height: 0;
    }
    .session-column { grid-column: 1; grid-row: 1; height: 420px; }
    .config-column { grid-column: 1; grid-row: 2; height: 420px; }
    .detail-column { grid-column: 1; grid-row: 3; height: 300px; min-height: 300px; }
    .tree-head .eyebrow { display: none; }
    .tree-head h2 { font-size: .92rem; }
    html.embed body { overflow: auto; }
    html.embed .page { height: auto; overflow: visible; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="brand">
      <span class="kicker">PROJECT / EVOLUTION TREES</span>
      <span class="brand-title">项目树</span>
    </div>
    <div class="top-mid">
      <div class="tabs" role="tablist" aria-label="切换项目">
        <button type="button" class="tab is-active" id="tab-a" role="tab" aria-selected="true" aria-controls="workspace">项目 A｜研究仓库</button>
        <button type="button" class="tab" id="tab-b" role="tab" aria-selected="false" aria-controls="workspace">项目 B｜展示页</button>
      </div>
    </div>
    <div class="top-right">
      <p class="meta" id="project-meta">molt · 节点 26 · 泳道 5 · 回退 4 次</p>
      <div class="current-chip" aria-live="polite"><span>当前</span><b id="current-rev">r12</b></div>
      <button type="button" class="close-button" id="close-page" title="关闭项目树">关闭</button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="column session-column" aria-label="会话树">
      <div class="tree-head">
        <div class="tree-title"><span class="eyebrow">SESSION TREE</span><h2>会话树</h2></div>
        <span class="tree-chip" id="session-count">26 节点 · 5 泳道</span>
      </div>
      <div class="lane-head" id="session-lane-head" aria-hidden="true">
        <div class="lane-head-track" id="session-lane-track"></div>
      </div>
      <div class="viewport" id="viewport">
        <div class="tree-scroll" id="tree-scroll">
          <svg id="tree" class="graph-svg" role="group" aria-label="会话树"></svg>
        </div>
      </div>
    </section>

    <section class="column config-column" aria-label="配置树">
      <div class="tree-head">
        <div class="tree-title"><span class="eyebrow">CONFIG TREE</span><h2>配置树</h2></div>
        <div class="config-head-right">
          <span class="tree-chip" id="config-count">10 节点 · 3 泳道</span>
          <span class="tree-chip is-current" id="config-current">当前 c9</span>
        </div>
      </div>
      <div class="lane-head" id="config-lane-head" aria-hidden="true">
        <div class="lane-head-track" id="config-lane-track"></div>
      </div>
      <div class="viewport" id="config-viewport">
        <div class="tree-scroll" id="config-scroll">
          <svg id="config-tree" class="graph-svg" role="group" aria-label="配置树"></svg>
        </div>
      </div>
    </section>

    <aside class="detail-column" id="detail" aria-live="polite" aria-label="详情">
      <div class="detail-head" id="detail-head"></div>
      <div class="detail-body" id="detail-body">
        <p class="detail-empty">选择会话或配置节点查看详情。</p>
      </div>
    </aside>

    <div class="loading" id="loading" hidden>
      <span class="spinner" aria-hidden="true"></span>
      <p>正在加载项目快照…</p>
    </div>

  function nodeDepth(node, byId) {

    for (var i = 0; i < parents.length; i++) {

    return items.length ? items.join(" ") : "无 skill";
  }

  function diffItems(items, parentItems) {
    var out = [];
    (items || []).forEach(function (name) {
      out.push({ name: name, mark: parentItems.indexOf(name) >= 0 ? "same" : "add" });
    });
    (parentItems || []).forEach(function (name) {
      if (items.indexOf(name) < 0) out.push({ name: name, mark: "remove" });
    });
    return out;
  }

  function changeList(node, primary) {
    var out = [];
    ["skills", "mcp", "memory"].forEach(function (key) {
      var current = node[key] || [];
      var previous = primary ? (primary[key] || []) : [];
      current.forEach(function (name) { if (previous.indexOf(name) < 0) out.push("+" + name); });
      previous.forEach(function (name) { if (current.indexOf(name) < 0) out.push("−" + name); });
    });
    return out;
  }

  /* ---------- 通用图渲染 ---------- */

  function appendDefs(svg, prefix) {
    var defs = svgEl("defs");
    [["normal", "#9AA6B4"], ["rollback", "#C0392B"], ["experiment", "#B98A2F"]].forEach(function (pair) {
      var marker = svgEl("marker", {
        id: prefix + "-" + pair[0],
        viewBox: "0 0 8 8",
        refX: "7",
        refY: "4",
        markerWidth: "7",
        markerHeight: "7",
        orient: "auto",
        markerUnits: "userSpaceOnUse"
      });
      marker.appendChild(svgEl("path", { d: "M0,0 L8,4 L0,8 Z", fill: pair[1] }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);
  }

  function renderGraph(svg, nodes, lanes, byId, options) {
    clear(svg);

    var maxDepth = 0;
    nodes.forEach(function (node) { maxDepth = Math.max(maxDepth, nodeDepth(node, byId)); });
    var width = LEFT + (lanes.length - 1) * LANE_GAP + NODE_W + RIGHT;
    var height = TOP + maxDepth * DEPTH_GAP + NODE_H + BOTTOM;

    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("width", String(width));
    svg.setAttribute("height", String(height));
    svg.setAttribute("aria-label", options.ariaLabel + "：" + nodes.length + " 个节点，" + lanes.length + " 条泳道");
    appendDefs(svg, options.markerPrefix);

    var laneLayer = svgEl("g", { class: "lane-layer" });
    lanes.forEach(function (lane, index) {
      var laneX = LEFT + index * LANE_GAP;
      laneLayer.appendChild(svgEl("rect", {
        class: "lane-band" + (index % 2 === 1 ? " alt" : ""),
        x: String(laneX - BAND_PAD),
        y: "0",
        width: String(LANE_GAP),
        height: String(height)
      }));
    });
    svg.appendChild(laneLayer);

    var edgeLayer = svgEl("g", { class: "edge-layer" });
    nodes.forEach(function (node) {
      nodeParents(node).forEach(function (parentId) {
        var parent = byId[parentId];
        if (!parent) return;
        var x1 = LEFT + parent.lane * LANE_GAP + NODE_W / 2;
        var y1 = TOP + nodeDepth(parent, byId) * DEPTH_GAP + NODE_H;
        var x2 = LEFT + node.lane * LANE_GAP + NODE_W / 2;
        var y2 = TOP + nodeDepth(node, byId) * DEPTH_GAP - 2;
        var mid = y1 + Math.max(10, (y2 - y1) / 2);
        var d = "M" + x1 + " " + y1 + " C" + x1 + " " + mid + " " + x2 + " " + mid + " " + x2 + " " + y2;
        var cls = "edge";
        var marker = "normal";
        if (node.action === "回退") {
          cls += " is-branch is-rollback";
          marker = "rollback";
        } else if (node.action === "实验") {
          cls += " is-branch is-experiment";
          marker = "experiment";
        }
        edgeLayer.appendChild(svgEl("path", {
          class: cls,
          d: d,
          "marker-end": "url(#" + options.markerPrefix + "-" + marker + ")"
        }));
      });
    });
    svg.appendChild(edgeLayer);

    var nodeLayer = svgEl("g", { class: "node-layer" });
    nodes.forEach(function (node) {
      var isCurrent = node.id === options.currentId;
      var isSelected = node.id === options.selectedId;
      var isLinked = node.id === options.linkedId;
      var isMatch = !!(options.matchConfigId && node.configRef === options.matchConfigId);
      var group = svgEl("g", { class: options.nodeClass + " graph-node", tabindex: "0", role: "button" });
      group.setAttribute("data-id", node.id);
      group.setAttribute("aria-label", nodeName(node) + " " + node.label + "，" + node.action + "，" + (node.messages ? node.messages.length + " 条消息" : (node.skills || []).length + " 项 skill"));
      group.setAttribute("aria-pressed", isSelected ? "true" : "false");
      if (isCurrent) group.setAttribute("aria-current", "true");
      if (isCurrent) group.classList.add("is-current");
      if (isSelected) group.classList.add("is-selected");
      if (isLinked) group.classList.add("is-linked");
      if (isMatch) group.classList.add("is-config-match");
      if (node.id === options.newNodeId) group.classList.add("is-new");

      var tip = svgEl("title");
      tip.textContent = nodeName(node) + " · " + node.label + " · " + node.note;
      group.appendChild(tip);

      var x = LEFT + node.lane * LANE_GAP;
      var y = TOP + nodeDepth(node, byId) * DEPTH_GAP;
      group.appendChild(svgEl("rect", {
        class: "node-card", x: String(x), y: String(y), width: String(NODE_W), height: String(NODE_H), rx: "4", ry: "4"
      }));
      group.appendChild(svgEl("rect", {
        class: "node-accent", x: String(x + 1), y: String(y + 5), width: "3", height: String(NODE_H - 10), rx: "1.5",
        fill: ACTION_COLOR[node.action] || "#6B7280"
      }));

      var line1 = svgEl("text", { class: "node-line", x: String(x + 10), y: String(y + 14) });
      line1.textContent = options.line1(node);
      group.appendChild(line1);

      var line2 = svgEl("text", { class: "node-line sub", x: String(x + 10), y: String(y + 27) });
      line2.textContent = options.line2(node);
      group.appendChild(line2);

      if (node.action === "合并") {
        var badgeW = 27;
        group.appendChild(svgEl("rect", {
          class: "merge-badge",
          x: String(x + NODE_W - badgeW - 3),
          y: String(y - 9),
          width: String(badgeW),
          height: "10",
          rx: "2.5"
        }));
        var badgeText = svgEl("text", {
          class: "merge-badge-text",
          x: String(x + NODE_W - badgeW / 2 - 3),
          y: String(y - 2)
        });
        badgeText.textContent = "合并";
        group.appendChild(badgeText);
      }

      if (isCurrent) {
        group.appendChild(svgEl("circle", {
          class: "node-dot", cx: String(x + NODE_W - 8), cy: String(y + 8), r: "2.6"
        }));
      }

      group.addEventListener("click", function () { options.onSelect(node.id); });
      group.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          options.onSelect(node.id);
        }
      });
      nodeLayer.appendChild(group);
    });
    svg.appendChild(nodeLayer);
  }

  function renderLaneHead(trackId, lanes) {
    var track = $(trackId);
    if (!track) return;
    clear(track);
    var width = LEFT + (lanes.length - 1) * LANE_GAP + NODE_W + RIGHT;
    track.style.width = width + "px";
    lanes.forEach(function (lane, index) {
      var label = el("span", "lane-head-label", lane.name);
      label.style.left = (LEFT + index * LANE_GAP + NODE_W / 2) + "px";
      track.appendChild(label);
    });
    var scroll = trackId === "session-lane-track" ? $("tree-scroll") : $("config-scroll");
    track.style.transform = "translateX(-" + (scroll ? scroll.scrollLeft : 0) + "px)";
  }

  function syncLaneHead(scrollId, trackId) {
    var scroll = $(scrollId);
    var track = $(trackId);
    if (!scroll || !track) return;
    scroll.addEventListener("scroll", function () {
      track.style.transform = "translateX(-" + scroll.scrollLeft + "px)";
    }, { passive: true });
  }

  function renderSessionTree() {
    renderGraph($("tree"), state.nodes, state.lanes, state.byId, {
      markerPrefix: "session",
      nodeClass: "tree-node",
      ariaLabel: "会话树",
      currentId: state.currentId,
      selectedId: state.selectedId,
      matchConfigId: state.config.matchId,
      newNodeId: state.newNodeId,
      line1: sessionLine1,
      line2: sessionLine2,
      onSelect: selectSession
    });
    renderLaneHead("session-lane-track", state.lanes);
    state.newNodeId = null;
  }

  function renderConfigTree() {
    renderGraph($("config-tree"), state.config.nodes, state.config.lanes, state.config.byId, {
      markerPrefix: "config",
      nodeClass: "config-node",
      ariaLabel: "配置树",
      currentId: state.config.currentId,
      selectedId: state.config.selectedId,
      linkedId: state.config.linkedId,
      line1: configLine1,
      line2: configLine2,
      onSelect: selectConfig
    });
    renderLaneHead("config-lane-track", state.config.lanes);
  }

  function refreshSessionSelection() {
    var groups = $("tree").querySelectorAll(".tree-node");
    for (var i = 0; i < groups.length; i++) {
      var group = groups[i];
      var id = group.getAttribute("data-id");
      var node = state.byId[id];
      var selected = id === state.selectedId;
      var current = id === state.currentId;
      var match = !!(state.config.matchId && node && node.configRef === state.config.matchId);
      group.classList.toggle("is-selected", selected);
      group.classList.toggle("is-current", current);
      group.classList.toggle("is-config-match", match);
      group.setAttribute("aria-pressed", selected ? "true" : "false");
      if (current) group.setAttribute("aria-current", "true");
      else group.removeAttribute("aria-current");
    }
  }

  function refreshConfigSelection() {
    var groups = $("config-tree").querySelectorAll(".config-node");
    for (var i = 0; i < groups.length; i++) {
      var group = groups[i];
      var id = group.getAttribute("data-id");
      var selected = id === state.config.selectedId;
      var linked = id === state.config.linkedId;
      var current = id === state.config.currentId;
      group.classList.toggle("is-selected", selected);
      group.classList.toggle("is-linked", linked);
      group.classList.toggle("is-current", current);
      group.setAttribute("aria-pressed", selected ? "true" : "false");
      if (current) group.setAttribute("aria-current", "true");
      else group.removeAttribute("aria-current");
    }
  }

  function bringIntoView(svgId, targetId) {
    var svg = $(svgId);
    if (!svg) return;
    var scroll = svgId === "tree" ? $("tree-scroll") : $("config-scroll");
    if (!scroll) return;
    var groups = svg.querySelectorAll(".graph-node");
    for (var i = 0; i < groups.length; i++) {
      if (groups[i].getAttribute("data-id") !== targetId) continue;
      var nodeRect = groups[i].getBoundingClientRect();
      var box = scroll.getBoundingClientRect();
      var pad = 10;
      if (nodeRect.top < box.top + pad) scroll.scrollTop -= (box.top + pad - nodeRect.top);
      else if (nodeRect.bottom > box.bottom - pad) scroll.scrollTop += (nodeRect.bottom - (box.bottom - pad));
      if (nodeRect.left < box.left + pad) scroll.scrollLeft -= (box.left + pad - nodeRect.left);
      else if (nodeRect.right > box.right - pad) scroll.scrollLeft += (nodeRect.right - (box.right - pad));
      return;
    }
  }

  /* ---------- 详情栏 ---------- */

  function appendFact(dl, label, value) {
    var row = el("div");
    row.appendChild(el("dt", null, label));
    row.appendChild(el("dd", null, value));
    dl.appendChild(row);
  }

  function detailFacts(items) {
    var dl = el("dl", "detail-facts");
    items.forEach(function (item) { appendFact(dl, item[0], item[1]); });
    return dl;
  }

  function renderDetailEmpty(text) {
    var detail = $("detail");
    var head = $("detail-head");
    var body = $("detail-body");
    detail.classList.remove("is-config");
    head.hidden = true;
    clear(head);
    clear(body);
    body.appendChild(el("p", "detail-empty", text));
    body.scrollTop = 0;
  }

  function renderSessionHead(node, notice) {
    var detail = $("detail");
    var head = $("detail-head");
    detail.classList.remove("is-config");
    head.hidden = false;
    clear(head);
    head.appendChild(el("p", "detail-kicker", "SNAPSHOT / " + node.rev));
    head.appendChild(el("h2", "detail-title", node.label));
    head.appendChild(detailFacts([
      ["动作", node.action],
      ["泳道", laneName(node.lane, state.lanes)],
      ["父节点", parentText(node, state.byId)],
      ["消息", node.messages.length + " 条"]
    ]));
    head.appendChild(el("p", "detail-config", "配置 " + node.configRef + (node.configInherited ? "（沿用）" : "") + " · " + configSummary(node.configRef)));
    if (node.note) head.appendChild(el("p", "detail-note", node.note));
    if (notice) head.appendChild(el("p", "detail-notice", notice));
  }

  function renderConfigDetail(node) {
    var detail = $("detail");
    var head = $("detail-head");
    var body = $("detail-body");
    detail.classList.add("is-config");
    head.hidden = false;
    clear(head);
    head.appendChild(el("p", "detail-kicker", "CONFIG / " + node.id));
    head.appendChild(el("h2", "detail-title", node.label));
    head.appendChild(detailFacts([
      ["动作", node.action],
      ["泳道", laneName(node.lane, state.config.lanes)],
      ["父版本", parentText(node, state.config.byId)],
      ["清单", node.skills.length + " skill · " + node.mcp.length + " MCP · " + node.memory.length + " memory"]
    ]));
    if (node.note) head.appendChild(el("p", "detail-note", node.note));

    clear(body);
    body.scrollTop = 0;
    var parents = nodeParents(node);
    var primary = parents.length ? state.config.byId[parents[0]] : null;
    var manifest = el("div", "manifest");
    ["skills", "mcp", "memory"].forEach(function (key) {
      var row = el("div", "manifest-row");
      row.appendChild(el("span", "manifest-key", key));
      var items = el("div", "manifest-items");
      var diff = diffItems(node[key] || [], primary ? (primary[key] || []) : []);
      if (!diff.length) {
        items.appendChild(el("span", "manifest-empty", "—"));
      } else {
        diff.forEach(function (item) {
          var mark = item.mark === "add" ? "+" : item.mark === "remove" ? "−" : "·";
          items.appendChild(el("span", "manifest-item is-" + item.mark, mark + item.name));
        });
      }
      row.appendChild(items);
      manifest.appendChild(row);
    });
    body.appendChild(manifest);

    var changes = changeList(node, primary);
    body.appendChild(el("p", "config-diff", primary
      ? ("相对 " + primary.id + "：" + (changes.length ? changes.join(" ") : "无变化"))
      : "根配置：空清单"));
    if (parents.length > 1) {
      body.appendChild(el("p", "config-diff", "双父合并：" + parents.join(" + ") + "（差异相对 " + parents[0] + "）"));
    }

    var bound = state.nodes.filter(function (sessionNode) { return sessionNode.configRef === node.id; });
    bound.sort(function (a, b) { return parseInt(a.rev.slice(1), 10) - parseInt(b.rev.slice(1), 10); });
    var bindings = el("p", "config-bindings");
    bindings.appendChild(el("b", null, "绑定会话 " + bound.length + " 个："));
    bindings.appendChild(document.createTextNode(bound.length ? bound.map(function (sessionNode) { return sessionNode.rev; }).join(" · ") : "暂无"));
    body.appendChild(bindings);
  }

  function linkSessionConfig(node) {
    if (!node || !node.configRef) return;
    var configNode = state.config.byId[node.configRef];
    if (!configNode) return;
    state.config.linkedId = configNode.id;
    state.config.selectedId = null;
    state.config.matchId = null;
    refreshConfigSelection();
    refreshSessionSelection();
    bringIntoView("config-tree", configNode.id);
  }

  function selectSession(id) {
    if (state.writing) return;
    var node = state.byId[id];
    if (!node) return;
    state.selectedId = id;
    refreshSessionSelection();
    bringIntoView("tree", id);
    linkSessionConfig(node);
    playNode(node);
  }

  function selectConfig(id) {
    if (state.writing) return;
    var node = state.config.byId[id];
    if (!node) return;
    state.config.selectedId = id;
    state.config.linkedId = id;
    state.config.matchId = id;
    state.playToken += 1;
    state.armedNode = null;
    if (state.armTimer) {
      clearTimeout(state.armTimer);
      state.armTimer = null;
    }
    refreshConfigSelection();
    refreshSessionSelection();
    renderConfigDetail(node);
    bringIntoView("config-tree", id);

    var first = null;
    for (var i = 0; i < state.nodes.length; i++) {
      if (state.nodes[i].configRef === id) { first = state.nodes[i].id; break; }
    }
    if (first) bringIntoView("tree", first);
  }

  function scrollDetail() {
    var body = $("detail-body");
    body.scrollTop = body.scrollHeight;
  }

  function appendMessageRow(log, message) {
    var row = el("div", "msg " + message.role);
    row.appendChild(el("p", "msg-role", ROLE_LABEL[message.role] || message.role));
    row.appendChild(el("p", "msg-body", message.text));
    log.appendChild(row);
    scrollDetail();
  }

  function appendPending(log, role) {
    var row = el("div", "msg pending " + role);
    row.appendChild(el("p", "msg-role", ROLE_LABEL[role] || role));
    var body = el("p", "msg-body");
    body.appendChild(el("span", "dots", role === "tool" ? "检索中…" : "输入中…"));
    row.appendChild(body);
    log.appendChild(row);
    scrollDetail();
    return row;
  }

  function playNode(node) {
    var token = ++state.playToken;
    state.armedNode = null;
    if (state.armTimer) {
      clearTimeout(state.armTimer);
      state.armTimer = null;
    }

    var notice = state.noticeText;
    state.noticeText = null;
    renderSessionHead(node, notice);

    var body = $("detail-body");
    clear(body);
    body.scrollTop = 0;
    var log = el("div", "detail-log" + (node.messages.length >= 4 ? " is-spread" : ""));
    body.appendChild(log);
    var actions = el("div", "detail-actions");
    body.appendChild(actions);
    var status = el("p", "detail-status", "读取快照 " + node.rev + "…");
    actions.appendChild(status);
    appendRollbackControl(actions, status, node, token);
    log.appendChild(el("p", "detail-loading", "读取快照 " + node.rev + "…"));

    (async function () {
      await sleep(300);
      if (token !== state.playToken) return;
      clear(log);

      var total = node.messages.length;
      for (var i = 0; i < total; i++) {
        var message = node.messages[i];
        var pending = appendPending(log, message.role);
        await sleep(message.role === "tool" ? 600 : rand(450, 700));
        if (token !== state.playToken) return;
        pending.remove();
        appendMessageRow(log, message);
        if (!state.writing) status.textContent = "这是第 " + (i + 1) + " 条 / 共 " + total + " 条";
        scrollDetail();
      }

      if (token !== state.playToken || state.writing) return;
      status.textContent = "本轮结束";
      status.classList.add("is-done");
    })();
  }

  function appendRollbackControl(actions, status, node, token) {
    if (node.id === state.currentId) return;
    var button = el("button", "rollback-btn", "回退到此节点");
    button.type = "button";
    button.addEventListener("click", function () {
      if (state.writing) return;
      if (state.armedNode !== node.id) {
        state.armedNode = node.id;
        button.textContent = "确认回退";
        button.classList.add("is-armed");
        status.classList.remove("is-done");
        status.textContent = "再点一次确认；回退只新增节点，不删除历史。";
        if (state.armTimer) clearTimeout(state.armTimer);
        state.armTimer = setTimeout(function () {
          if (state.armedNode !== node.id) return;
          state.armedNode = null;
          button.textContent = "回退到此节点";
          button.classList.remove("is-armed");
          if (!status.classList.contains("is-done")) status.textContent = "已取消确认。";
        }, 15000);
        return;
      }
      performRollback(node, button, status, token);
    });
    actions.appendChild(button);
  }

  async function performRollback(target, button, status, token) {
    state.writing = true;
    state.armedNode = null;
    if (state.armTimer) {
      clearTimeout(state.armTimer);
      state.armTimer = null;
    }
    button.disabled = true;
    button.textContent = "写入快照…";
    status.classList.remove("is-done");
    status.textContent = "写入快照…";

    await sleep(600);
    state.writing = false;

    if (state.selectedId !== target.id || token !== state.playToken) return;

    var existing = findRollback(target.id);
    if (existing) {
      state.currentId = existing.id;
      state.selectedId = existing.id;
      updateHeader();
      renderSessionTree();
      state.noticeText = "已存在从 " + target.rev + " 的回退节点，直接切换到该快照。";
      linkSessionConfig(existing);
      bringIntoView("tree", existing.id);
      playNode(existing);
      return;
    }

    var depth = nodeDepth(target, state.byId) + 1;
    var lane = allocateLane(depth);
    var rev = nextRev();
    var node = {
      id: "rollback-" + (++state.dynamicSeq),
      rev: rev,
      label: "回退 · 从 " + target.rev,
      action: "回退",
      messages: cloneMessages(target.messages),
      parent: target.id,
      lane: lane,
      note: "从 " + target.rev + " 回退 · 演示新增，原节点全部保留",
      rollbackFrom: target.id,
      configRef: target.configRef,
      configInherited: true,
      dynamic: true
    };

    state.nodes.push(node);
    state.byId[node.id] = node;
    state.currentId = node.id;
    state.selectedId = node.id;
    state.newNodeId = node.id;
    updateHeader();
    renderSessionTree();
    state.noticeText = "已写入新快照 " + rev + "；配置 " + node.configRef + " 沿用，原节点全部保留。";
    linkSessionConfig(node);
    bringIntoView("tree", node.id);
    playNode(node);
  }

  function findRollback(sourceId) {
    for (var i = 0; i < state.nodes.length; i++) {
      var node = state.nodes[i];
      if (node.action === "回退" && node.rollbackFrom === sourceId) return node;
    }
    return null;
  }

  function laneBusy(laneIndex, depth) {
    for (var i = 0; i < state.nodes.length; i++) {
      var node = state.nodes[i];
      if (node.lane === laneIndex && nodeDepth(node, state.byId) === depth) return true;
    }
    return false;
  }

  function allocateLane(depth) {
    var i;
    for (i = 0; i < state.lanes.length; i++) {
      if (state.lanes[i].kind === "rollback" && !laneBusy(i, depth)) return i;
    }
    for (i = 1; i < state.lanes.length; i++) {
      if (!laneBusy(i, depth)) return i;
    }
    var rollbackLaneCount = 0;
    for (i = 0; i < state.lanes.length; i++) {
      if (state.lanes[i].kind === "rollback") rollbackLaneCount += 1;
    }
    state.lanes.push({ name: "回退 " + pad2(rollbackLaneCount + 1), kind: "rollback" });
    return state.lanes.length - 1;
  }

  function nextRev() {
    var prefix = state.project.revPrefix;
    var max = -1;
    state.nodes.forEach(function (node) {
      var match = /^([a-z]+)(\d+)$/.exec(node.rev);
      if (match && match[1] === prefix) max = Math.max(max, parseInt(match[2], 10));
    });
    return prefix + (max + 1);
  }

  /* ---------- 顶部 / 加载 ---------- */

  function setActiveTab(key) {
    var tabA = $("tab-a");
    var tabB = $("tab-b");
    tabA.classList.toggle("is-active", key === "a");
    tabB.classList.toggle("is-active", key === "b");
    tabA.setAttribute("aria-selected", key === "a" ? "true" : "false");
    tabB.setAttribute("aria-selected", key === "b" ? "true" : "false");
  }

  function updateHeader() {
    if (!state.project) return;
    var rollbacks = 0;
    state.nodes.forEach(function (node) { if (node.action === "回退") rollbacks += 1; });
    $("project-meta").textContent = state.project.short + " · 节点 " + state.nodes.length + " · 泳道 " + state.lanes.length + " · 回退 " + rollbacks + " 次";
    var current = state.byId[state.currentId];
    $("current-rev").textContent = current ? current.rev : "—";
    $("session-count").textContent = state.nodes.length + " 节点 · " + state.lanes.length + " 泳道";
    $("config-count").textContent = state.config.nodes.length + " 节点 · " + state.config.lanes.length + " 泳道";
    var configCurrent = state.config.currentId ? state.config.byId[state.config.currentId] : null;
    $("config-current").textContent = configCurrent ? "当前 " + configCurrent.id : "当前 —";
  }

  function showLoading(flag) { $("loading").hidden = !flag; }

  function renderProjectLoading() { renderDetailEmpty("正在加载项目快照…"); }

  /* ---------- 项目切换 ---------- */

  function snapshotRuntime() {
    if (!state.projectId) return;
    state.cache[state.projectId] = {
      nodes: state.nodes,
      lanes: state.lanes,
      currentId: state.currentId,
      dynamicSeq: state.dynamicSeq
    };
  }

  function loadProject(key) {
    if (state.loading || state.writing) return;
    if (state.projectId === key) return;
    var fixture = PROJECT_FIXTURES[key];
    if (!fixture) return;

    snapshotRuntime();

    state.loading = true;
    state.loadToken += 1;
    state.playToken += 1;
    var token = state.loadToken;
    setActiveTab(key);
    renderProjectLoading();
    showLoading(true);
    $("tree-scroll").scrollTop = 0;
    $("tree-scroll").scrollLeft = 0;
    $("config-scroll").scrollTop = 0;
    $("config-scroll").scrollLeft = 0;
    $("tree").classList.remove("is-visible");
    $("config-tree").classList.remove("is-visible");

    var wait = 500 + Math.random() * 200;
    sleep(wait).then(function () {
      if (token !== state.loadToken) return;

      var saved = state.cache[key];
      state.projectId = key;
      state.project = fixture;
      if (saved) {
        state.nodes = saved.nodes;
        state.lanes = saved.lanes;
        state.currentId = saved.currentId;
        state.dynamicSeq = saved.dynamicSeq;
      } else {
        state.nodes = cloneSessionNodes(fixture.nodes);
        state.lanes = cloneLanes(fixture.lanes);
        state.currentId = fixture.current;
        state.dynamicSeq = 0;
      }
      state.byId = {};
      state.nodes.forEach(function (node) { state.byId[node.id] = node; });

      var configTree = fixture.configTree;
      state.config = {
        nodes: cloneConfigNodes(configTree.nodes),
        byId: {},
        lanes: cloneLanes(configTree.lanes),
        currentId: configTree.current,
        selectedId: null,
        linkedId: null,
        matchId: null
      };
      state.config.nodes.forEach(function (node) { state.config.byId[node.id] = node; });

      state.selectedId = null;
      state.armedNode = null;
      state.writing = false;
      state.newNodeId = null;
      state.noticeText = null;
      if (state.armTimer) {
        clearTimeout(state.armTimer);
        state.armTimer = null;
      }
      state.playToken += 1;

      renderSessionTree();
      renderConfigTree();
      updateHeader();
      showLoading(false);
      state.loading = false;

      requestAnimationFrame(function () {
        $("tree").classList.add("is-visible");
        $("config-tree").classList.add("is-visible");
      });
      selectSession(state.currentId);
    });
  }

  /* ---------- 关闭 / 绑定 ---------- */

  function closePage() {
    if (EMBED) {
      try {
        var board = window.parent.document.getElementById("project-board");
        if (board) {
          board.hidden = true;
          window.parent.document.body.style.overflow = "";
        }
      } catch (err) { /* 忽略跨域或父页面变化 */ }
      return;
    }
    if (window.history.length > 1) window.history.back();
    else window.location.href = "../chat/index.html";
  }

  function bind() {
    $("tab-a").addEventListener("click", function () { loadProject("a"); });
    $("tab-b").addEventListener("click", function () { loadProject("b"); });
    $("close-page").addEventListener("click", closePage);
    syncLaneHead("tree-scroll", "session-lane-track");
    syncLaneHead("config-scroll", "config-lane-track");

    var resizeTimer = null;
    function scrollToSelection() {
      if (!state.projectId) return;
      var sessionTarget = state.selectedId || state.currentId;
      if (sessionTarget) bringIntoView("tree", sessionTarget);
      if (state.config.linkedId) bringIntoView("config-tree", state.config.linkedId);
    }
    window.addEventListener("resize", function () {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(scrollToSelection, 80);
    });
    if (typeof ResizeObserver !== "undefined") {
      var lastWidth = -1;
      var lastHeight = -1;
      var observer = new ResizeObserver(function (entries) {
        var rect = entries[0].contentRect;
        if (rect.width === lastWidth && rect.height === lastHeight) return;
        lastWidth = rect.width;
        lastHeight = rect.height;
        if (rect.width > 0 && rect.height > 0) scrollToSelection();
      });
      observer.observe($("viewport"));
      observer.observe($("config-viewport"));
    }

    if (!EMBED) {
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") return;
        closePage();
      });
    }
  }

  bind();
  loadProject("a");
})();
</script>
</body>
</html>
