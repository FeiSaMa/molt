<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOLT · 项目树 · 对话回放</title>
<style>
  :root {
    color-scheme: light;
    --paper: #FCFCFD;
    --paper-2: #F4F5F7;
    --ink: #14161A;
    --ink-2: #3A4048;
    --ink-3: #6B7280;
    --line: #E6E8EC;
    --red: #C0392B;
    --indigo: #1B4D8F;
    --gold: #B98A2F;
    --green: #1E7A46;
    --font-display: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    --font-body: -apple-system, "HarmonyOS Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --font-num: "SF Mono", ui-monospace, "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 8% -10%, rgba(27,77,143,.055), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(185,138,47,.06), transparent 55%),
      var(--paper);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: clamp(14px, 2.2vh, 26px) clamp(16px, 2.4vw, 34px) 10px;
    overflow: hidden;
  }

  /* ---------- 顶部信息条 ---------- */
  .top {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    gap: 10px 24px;
    align-items: end;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--line);
  }
  .kicker { margin: 0; color: var(--indigo); font: 600 .6rem var(--font-num); letter-spacing: .14em; }
  .back-link {
    display: inline-block;
    margin-top: 6px;
    color: var(--ink-3);
    font: .62rem var(--font-num);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .back-link:hover { color: var(--indigo); border-color: var(--indigo); }
  .top-mid { text-align: center; min-width: 0; }
  .tabs {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: rgba(255,255,255,.72);
  }
  .tab {
    padding: 6px 12px;
    border: 0;
    border-radius: 3px;
    color: var(--ink-3);
    background: transparent;
    font: 500 .72rem var(--font-body);
    white-space: nowrap;
    cursor: pointer;
    transition: color .18s ease, background .18s ease, box-shadow .18s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab.is-active { color: var(--indigo); background: #F3F6FA; box-shadow: inset 0 0 0 1px #DCE5EF; }
  .meta { margin: 7px 0 0; color: var(--ink-3); font: .6rem var(--font-num); letter-spacing: .03em; }
  .current-chip {
    justify-self: end;
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 6px 11px;
    border: 1px solid #C9D4E2;
    border-radius: 4px;
    background: #F6F9FC;
    color: var(--indigo);
    white-space: nowrap;
  }
  .current-chip span { font: 600 .54rem var(--font-num); letter-spacing: .12em; }
  .current-chip b { font: 600 1.08rem var(--font-num); letter-spacing: -.02em; }

  /* ---------- 主体 ---------- */
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(330px, 372px);
    gap: clamp(12px, 1.6vw, 22px);
    flex: 1;
    min-height: 0;
    padding-top: clamp(8px, 1.2vh, 14px);
  }
  .tree-panel { display: flex; min-width: 0; min-height: 0; }
  .viewport {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background-color: rgba(255,255,255,.58);
    background-image:
      linear-gradient(rgba(27,77,143,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(27,77,143,.045) 1px, transparent 1px);
    background-size: 22px 22px;
    overflow: hidden;
  }
  .tree { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .2s ease; }
  .tree.is-visible { opacity: 1; }

  .loading {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(252,252,253,.9);
    backdrop-filter: blur(2px);
  }
  .loading[hidden] { display: none; }
  .loading p { margin: 0; color: var(--ink-3); font: .64rem var(--font-num); letter-spacing: .06em; }
  .spinner {
    width: 18px;
    height: 18px;
    border: 1.5px solid #D5DCE5;
    border-top-color: var(--indigo);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .legend {
    position: absolute;
    left: 10px;
    bottom: 8px;
    z-index: 3;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 3px 13px;
    color: var(--ink-3);
    font: .56rem var(--font-num);
    pointer-events: none;
  }
  .legend .line {
    display: inline-block;
    width: 17px;
    height: 0;
    margin-right: 5px;
    border-top: 1.2px solid #8A97A6;
    vertical-align: middle;
  }
  .legend .dashed { border-top-style: dashed; border-top-color: var(--red); }
  .legend-sep { padding-left: 11px; border-left: 1px solid var(--line); }

  /* ---------- SVG 树 ---------- */
  .lane-band { fill: rgba(244,245,247,.42); }
  .lane-band.alt { fill: rgba(255,255,255,0); }
  .lane-line { stroke: var(--line); stroke-width: 1; }
  .lane-label { fill: var(--ink-3); font-family: var(--font-num); font-size: 8.5px; font-weight: 600; letter-spacing: .06em; }
  .lane-count { fill: #A7AFB9; font-family: var(--font-num); font-size: 8px; }

  .edge { fill: none; stroke: #9AA6B4; stroke-width: 1.2; opacity: .6; }
  .edge.is-branch { stroke-dasharray: 4 3; opacity: .78; }
  .edge.is-rollback { stroke: var(--red); }
  .edge.is-experiment { stroke: var(--gold); }

  .tree-node { cursor: pointer; outline: none; }
  .tree-node .node-card {
    fill: #fff;
    stroke: #DDE2E8;
    stroke-width: 1;
    transition: fill .15s ease, stroke .15s ease;
  }
  .tree-node:hover .node-card { stroke: #B9C7D6; }
  .tree-node:focus-visible .node-card { stroke: var(--indigo); stroke-width: 2.2; }
  .tree-node.is-selected .node-card { fill: #F3F7FC; stroke: var(--indigo); stroke-width: 2.2; }
  .tree-node.is-current .node-card { stroke: var(--indigo); stroke-width: 1.8; }
  .tree-node.is-current.is-selected .node-card { stroke-width: 2.4; }
  .tree-node.is-new { animation: node-in .3s ease both; }
  @keyframes node-in { from { opacity: 0; } to { opacity: 1; } }
  .node-title { fill: var(--ink); font-family: var(--font-body); font-size: 12.5px; font-weight: 600; }
  .node-meta { fill: var(--ink-3); font-family: var(--font-num); font-size: 9.5px; }
  .node-flag {
    fill: var(--indigo);
    font-family: var(--font-num);
    font-size: 7.5px;
    font-weight: 600;
    letter-spacing: .08em;
    text-anchor: end;
  }

  /* ---------- 右侧回放面板 ---------- */
  .replay {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: rgba(255,255,255,.76);
    box-shadow: 0 14px 38px rgba(20,22,26,.045);
    overflow: hidden;
  }
  .replay-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
  .replay-kicker { margin: 0; color: var(--indigo); font: 600 .56rem var(--font-num); letter-spacing: .12em; }
  .replay-title { margin: 6px 0 0; font: 600 clamp(.98rem, 1.2vw, 1.14rem)/1.35 var(--font-display); overflow-wrap: anywhere; }
  .replay-stats { margin: 7px 0 0; color: var(--ink-3); font: .59rem/1.65 var(--font-num); }
  .replay-note { margin: 6px 0 0; color: var(--ink-3); font-size: .62rem; line-height: 1.6; }
  .replay-chip {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 6px;
    border: 1px solid #C9D4E2;
    border-radius: 2px;
    color: var(--indigo);
    background: #F5F8FC;
    font: 600 .54rem var(--font-num);
    letter-spacing: .08em;
  }
  .replay-notice {
    margin: 8px 0 0;
    padding: 5px 8px;
    border-left: 2px solid var(--gold);
    background: #FDFAF3;
    color: #8A6A1F;
    font-size: .6rem;
    line-height: 1.6;
  }
  .replay-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .replay-empty { margin: 18px 4px; color: var(--ink-3); font-size: .72rem; line-height: 1.7; }
  .replay-loading { margin: 16px 4px; color: var(--ink-3); font: .62rem var(--font-num); letter-spacing: .04em; }
  .replay-foot { border-top: 1px solid var(--line); padding: 9px 14px 11px; }
  .replay-status { margin: 0; color: var(--ink-3); font: .58rem var(--font-num); line-height: 1.6; }
  .replay-status.is-done { color: var(--green); }

  .msg { display: flex; flex-direction: column; gap: 3px; animation: msg-in .22s ease both; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .msg-role { margin: 0; color: var(--ink-3); font: 600 .54rem var(--font-num); letter-spacing: .1em; }
  .msg-body { margin: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink-2); font-size: .71rem; line-height: 1.68; overflow-wrap: anywhere; }
  .msg.user .msg-role { color: var(--indigo); }
  .msg.user .msg-body { border-color: #D7E1ED; background: #F6F9FC; }
  .msg.assistant .msg-role { color: var(--green); }
  .msg.tool .msg-role { color: var(--gold); }
  .msg.tool .msg-body {
    padding: 5px 8px;
    border: 0;
    border-left: 2px solid rgba(185,138,47,.6);
    border-radius: 0 3px 3px 0;
    background: rgba(244,245,247,.75);
    color: var(--ink-3);
    font: .58rem/1.6 var(--font-num);
  }
  .msg.pending .msg-body { color: var(--ink-3); }
  .dots { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .rollback-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid #C9D4E2;
    border-radius: 4px;
    background: #F6F9FC;
    color: var(--indigo);
    font: 500 .7rem var(--font-body);
    cursor: pointer;
    transition: border-color .18s ease, background .18s ease, color .18s ease;
  }
  .rollback-btn:hover { border-color: var(--indigo); }
  .rollback-btn.is-armed { border-color: #D9A7A1; background: #FDF6F5; color: var(--red); }
  .rollback-btn:disabled { opacity: .55; cursor: default; }

  /* ---------- 页脚 ---------- */
  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 4px 18px;
    padding-top: 8px;
    color: var(--ink-3);
    font-size: .56rem;
    line-height: 1.6;
  }
  .foot b { color: var(--ink-2); font-weight: 600; }

  /* ---------- iframe 嵌入 ---------- */
  html.embed body { overflow: hidden; }
  html.embed .page { height: 100vh; padding: 8px 10px 6px; }
  html.embed .back-link, html.embed .foot { display: none; }
  html.embed .top { padding-bottom: 8px; align-items: center; }
  html.embed main { padding-top: 6px; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 980px) {
    body { overflow: auto; }
    .page { height: auto; padding: 14px 14px 10px; overflow: visible; }
    .top { grid-template-columns: 1fr auto; }
    .top-mid { grid-column: 1 / -1; grid-row: 2; text-align: left; }
    .top-mid .tabs { width: 100%; }
    .tab { flex: 1; }
    main { grid-template-columns: 1fr; overflow: visible; }
    .tree-panel { height: 520px; }
    .replay { height: 460px; }
    html.embed body { overflow: auto; }
    html.embed .page { height: auto; overflow: visible; }
    html.embed .tree-panel { height: 460px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="top-left">
      <p class="kicker">PROJECT TREE / DEMO</p>
      <a class="back-link" id="back-link" href="../chat/index.html">← 返回研究对话</a>
    </div>
    <div class="top-mid">
      <div class="tabs" role="tablist" aria-label="切换项目">
        <button type="button" class="tab is-active" id="tab-a" role="tab" aria-selected="true" aria-controls="tree-panel">项目 A｜研究仓库</button>
        <button type="button" class="tab" id="tab-b" role="tab" aria-selected="false" aria-controls="tree-panel">项目 B｜展示页</button>
      </div>
      <p class="meta" id="project-meta">molt · 节点 14 · 泳道 4 · 回退 2 次</p>
    </div>
    <div class="current-chip" aria-live="polite"><span>当前</span><b id="current-rev">r7</b></div>
  </header>

  <main>
    <section class="tree-panel" id="tree-panel" aria-label="项目进化树">
      <div class="viewport" id="viewport">
        <svg id="tree" class="tree" role="group" aria-label="项目进化树"></svg>
        <div class="loading" id="loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <p>正在加载项目快照…</p>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i class="line"></i>提交</span>
          <span><i class="line dashed"></i>回退 / 实验</span>
          <span class="legend-sep">Tab 聚焦节点 · Enter 选中</span>
        </div>
      </div>
    </section>
    <aside class="replay" id="replay" aria-live="polite" aria-label="对话回放">
      <p class="replay-empty">正在加载项目快照…</p>
    </aside>
  </main>

  <footer class="foot">
    <span><b>DEMO_FIXTURE</b> 两棵手工构造的树；回退只新增节点，不删除历史</span>
    <span>8 项审查清单 8/8 ｜ 资料库 189 = 153 + 20 + 10 + 1 + 5</span>
  </footer>
</div>

<script id="project-fixtures">
/* DEMO_FIXTURE — 手工构造的演示数据。
   口径：8/8 是 8 项审查清单得分；189 = 153 + 20 + 10 + 1 + 5；
   demo-6 / demo-7 只作为版本标识，不混用数值。
   说明：题目列出的关键链共 9 / 7 个节点；为撑起「复杂进化树」并达到
   14 / 10 个节点，在既有支线末端补了同风格的延续节点（r9–r13、b7–b9），
   不改动任何关键节点的父子关系。 */
var PROJECT_FIXTURES = {
  a: {
    id: "a",
    name: "项目 A｜研究仓库",
    short: "molt",
    revPrefix: "r",
    current: "r7",
    lanes: [
      { name: "主线", kind: "main" },
      { name: "支线 r1", kind: "branch" },
      { name: "实验", kind: "experiment" },
      { name: "支线 r5", kind: "branch" }
    ],
    nodes: [
      {
        id: "r0", rev: "r0", label: "建立仓库", action: "起始", parent: null, lane: 0,
        note: "起点：研究仓库的只读约定",
        messages: [
          { role: "user", text: "先把这次研究的口径固定下来：结论必须能回到检索记录和原文。" },
          { role: "assistant", text: "收到。我先读仓库约定，再把「结论 / 证据 / 限制」拆成三层，后续每次修订只动一层。" },
          { role: "tool", text: "读取 AGENTS.md：研究仓库只读约定、提交格式、禁改清单", tool: "读取 AGENTS.md" }
        ]
      },
      {
        id: "r1", rev: "r1", label: "检索规则", action: "保留", parent: "r0", lane: 0,
        note: "把检索规则写死，后续节点都按它走",
        messages: [
          { role: "user", text: "检索这块先定规则：先查项目知识库，再读 claims，不要凭记忆写数字。" },
          { role: "assistant", text: "规则写成三步：一、检索 project_kb 的 scenario-versions；二、读 claims.md 核对数字；三、找不到来源就不写。" },
          { role: "tool", text: "检索 project_kb：scenario-versions", tool: "检索 project_kb" },
          { role: "assistant", text: "检索结果里 demo-6 与 demo-7 是两组版本号；跨版本的成本与通过数不能放进同一张表比较。" }
        ]
      },
      {
        id: "r2", rev: "r2", label: "写结论", action: "保留", parent: "r1", lane: 0,
        note: "结论草稿；8 项审查清单 8/8",
        messages: [
          { role: "user", text: "按这个规则写一版结论，顺便报一下 8 项审查清单的分数。" },
          { role: "assistant", text: "结论草稿：本次 8 项审查清单得分 8/8；其中结论 4 项、证据 4 项，逐项都能落到检索记录。" },
          { role: "tool", text: "读取 claims.md", tool: "读取 claims.md" },
          { role: "assistant", text: "claims 里只有可复核的条目才会进正文；资料库当前覆盖 189 条。" },
          { role: "user", text: "189 这个数要在页脚拆开写，别只给总数。" },
          { role: "assistant", text: "页脚按 153 lessons + 20 Skill + 10 Agent + 1 AGENTS.md + 5 MCP 拆开，合计 189。" }
        ]
      },
      {
        id: "r4", rev: "r4", label: "修补口径", action: "保留", parent: "r2", lane: 0,
        note: "修补口径：审查得分与通过数分开",
        messages: [
          { role: "user", text: "检查一下有没有把「审查得分」写成「通过题数」。" },
          { role: "assistant", text: "发现一处：摘要里把 8/8 说成通过数。8/8 是 8 项审查清单的得分，不是题目通过数。" },
          { role: "tool", text: "检索 project_kb：审查清单", tool: "检索 project_kb" },
          { role: "assistant", text: "已改成「8 项审查清单 8/8」，并补一句：清单覆盖结论与证据各 4 项。" }
        ]
      },
      {
        id: "r7", rev: "r7", label: "定稿摘要", action: "保留", parent: "r4", lane: 0,
        note: "当前快照：定稿摘要 + 限制条件",
        messages: [
          { role: "user", text: "把摘要定稿；限制条件要留在正文，不许挪到脚注。" },
          { role: "assistant", text: "定稿：结论只保留能被检索记录支持的部分，限制条件紧随结论。" },
          { role: "tool", text: "读取 evidence-chain", tool: "读取 evidence-chain" },
          { role: "assistant", text: "证据链已对齐：每条结论都有对应的检索记录与原文位置。" },
          { role: "user", text: "好，这一版作为当前快照。" }
        ]
      },
      {
        id: "r3", rev: "r3", label: "回退到 r1", action: "回退", parent: "r1", lane: 1,
        note: "从 r1 回退 · r2 草稿保留但不沿用", rollbackFrom: "r1",
        messages: [
          { role: "user", text: "r2 那版结论先撤回，口径还没对齐，回到 r1 重来。" },
          { role: "assistant", text: "已回退到 r1：r2 的草稿保留在历史里，不删除；接下来只改检索规则相关部分。" },
          { role: "tool", text: "读取 claims.md", tool: "读取 claims.md" }
        ]
      },
      {
        id: "r5", rev: "r5", label: "继续修订", action: "保留", parent: "r3", lane: 1,
        note: "从 r3 继续 · 证据链补齐",
        messages: [
          { role: "user", text: "从 r1 的口径继续，先把证据链补全。" },
          { role: "assistant", text: "按 r1 的三步规则重跑一遍：检索、核对、再落结论。" },
          { role: "tool", text: "检索 project_kb：evidence-chain", tool: "检索 project_kb" },
          { role: "assistant", text: "把证据记录补齐；其中 demo-6 只作为版本标识出现，不参与任何数值比较。" }
        ]
      },
      {
        id: "r6", rev: "r6", label: "并表实验", action: "实验", parent: "r2", lane: 2,
        note: "实验分支 · 并表方案未合并",
        messages: [

<script>
(function () {
  "use strict";

  var EMBED = new URLSearchParams(window.location.search).get("embed") === "1";
  if (EMBED) document.documentElement.classList.add("embed");

  var ACTION_COLOR = { "起始": "#3A4048", "保留": "#1B4D8F", "回退": "#C0392B", "实验": "#B98A2F" };
  var ROLE_LABEL = { user: "你", assistant: "molt", tool: "工具" };

  var GUTTER = 86;
  var TOP = 10;
  var LANE_H = 96;
  var NODE_W = 122;
  var NODE_H = 62;
  var COL_PITCH = 140;
  var RIGHT = 18;
  var BOTTOM = 30;

  var state = {
    projectId: null,
    project: null,
    nodes: [],
    byId: {},
    lanes: [],
    currentId: null,
    selectedId: null,
    armedNode: null,
    armTimer: null,
    writing: false,
    loading: false,
    loadToken: 0,
    playToken: 0,
    newNodeId: null,
    dynamicSeq: 0,
    noticeText: null,
    cache: {}
  };

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function svgEl(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (key) {
        node.setAttribute(key, attrs[key]);
      });
    }
    return node;
  }

  function clear(parent) {
    while (parent.firstChild) parent.removeChild(parent.firstChild);
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function rand(min, max) {
    return min + Math.random() * (max - min);
  }

  function pad2(n) {
    return (n < 10 ? "0" : "") + n;
  }

  function cloneMessages(list) {
    return list.map(function (message) {
      return { role: message.role, text: message.text, tool: message.tool };
    });
  }

  function cloneNodes(list) {
    return list.map(function (node) {
      return {
        id: node.id,
        rev: node.rev,
        label: node.label,
        action: node.action,
        messages: cloneMessages(node.messages),
        parent: node.parent,
        lane: node.lane,
        note: node.note || "",
        rollbackFrom: node.rollbackFrom || null,
        dynamic: false
      };
    });
  }

  function cloneLanes(list) {
    return list.map(function (lane) {
      return { name: lane.name, kind: lane.kind || "branch" };
    });
  }

  function nodeDepth(node) {
    var seen = {};
    var current = node;
    var depth = 0;
    while (current && current.parent && !seen[current.id]) {
      seen[current.id] = true;
      var parent = state.byId[current.parent];
      if (!parent) break;
      depth += 1;
      current = parent;
    }
    return depth;
  }

  function laneName(index) {
    var lane = state.lanes[index];
    return lane ? lane.name : "—";
  }

  function parentText(node) {
    if (!node.parent) return "—";
    var parent = state.byId[node.parent];
    return parent ? parent.rev : node.parent;
  }

  function nextRev() {
    var prefix = state.project.revPrefix;
    var max = -1;
    state.nodes.forEach(function (node) {
      var match = /^([a-z]+)(\d+)$/.exec(node.rev);
      if (match && match[1] === prefix) {
        max = Math.max(max, parseInt(match[2], 10));
      }
    });
    return prefix + (max + 1);
  }

  function findRollback(sourceId) {
    for (var i = 0; i < state.nodes.length; i++) {
      var node = state.nodes[i];
      if (node.action === "回退" && node.rollbackFrom === sourceId) return node;
    }
    return null;
  }

  function laneBusy(laneIndex, depth) {
    for (var i = 0; i < state.nodes.length; i++) {
      var node = state.nodes[i];
      if (node.lane === laneIndex && nodeDepth(node) === depth) return true;
    }
    return false;
  }

  function allocateLane(depth) {
    var rollbackLaneCount = 0;
    for (var i = 0; i < state.lanes.length; i++) {
      if (state.lanes[i].kind !== "rollback") continue;
      rollbackLaneCount += 1;
      if (!laneBusy(i, depth)) return i;
    }
    state.lanes.push({ name: "回退 " + pad2(rollbackLaneCount + 1), kind: "rollback" });
    return state.lanes.length - 1;
  }

  /* ---------- 顶部与面板骨架 ---------- */

  function setActiveTab(key) {
    var tabA = $("tab-a");
    var tabB = $("tab-b");
    tabA.classList.toggle("is-active", key === "a");
    tabB.classList.toggle("is-active", key === "b");
    tabA.setAttribute("aria-selected", key === "a" ? "true" : "false");
    tabB.setAttribute("aria-selected", key === "b" ? "true" : "false");
  }

  function updateHeader() {
    if (!state.project) return;
    var rollbacks = 0;
    state.nodes.forEach(function (node) {
      if (node.action === "回退") rollbacks += 1;
    });
    $("project-meta").textContent = state.project.short + " · 节点 " + state.nodes.length + " · 泳道 " + state.lanes.length + " · 回退 " + rollbacks + " 次";
    var current = state.byId[state.currentId];
    $("current-rev").textContent = current ? current.rev : "—";
  }

  function showLoading(flag) {
    $("loading").hidden = !flag;
  }

  function renderProjectLoading() {
    var panel = $("replay");
    clear(panel);
    panel.appendChild(el("p", "replay-empty", "正在加载项目快照…"));
  }

  /* ---------- 树渲染 ---------- */

  function appendDefs(svg) {
    var defs = svgEl("defs");
    [
      ["arrow-normal", "#9AA6B4"],
      ["arrow-rollback", "#C0392B"],
      ["arrow-experiment", "#B98A2F"]
    ].forEach(function (pair) {
      var marker = svgEl("marker", {
        id: pair[0],
        viewBox: "0 0 8 8",
        refX: "7",
        refY: "4",
        markerWidth: "7",
        markerHeight: "7",
        orient: "auto",
        markerUnits: "userSpaceOnUse"
      });
      marker.appendChild(svgEl("path", { d: "M0,0 L8,4 L0,8 Z", fill: pair[1] }));
      defs.appendChild(marker);
    });
    svg.appendChild(defs);
  }

  function renderTree() {
    var svg = $("tree");
    clear(svg);

    var maxDepth = 0;
    state.nodes.forEach(function (node) {
      maxDepth = Math.max(maxDepth, nodeDepth(node));
    });
    var width = GUTTER + maxDepth * COL_PITCH + NODE_W + RIGHT;
    var height = TOP + state.lanes.length * LANE_H + BOTTOM;

    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("aria-label", state.project.short + " 项目进化树：" + state.nodes.length + " 个节点，" + state.lanes.length + " 条泳道");
    appendDefs(svg);

    var laneLayer = svgEl("g", { class: "lane-layer" });
    state.lanes.forEach(function (lane, index) {
      var laneTop = TOP + index * LANE_H;
      laneLayer.appendChild(svgEl("rect", {
        class: "lane-band" + (index % 2 === 1 ? " alt" : ""),
        x: "0",
        y: String(laneTop),
        width: String(width),
        height: String(LANE_H)
      }));
      laneLayer.appendChild(svgEl("line", {
        class: "lane-line",
        x1: "0",
        y1: String(laneTop),
        x2: String(width),
        y2: String(laneTop)
      }));
      var count = 0;
      state.nodes.forEach(function (node) {
        if (node.lane === index) count += 1;
      });
      var label = svgEl("text", { class: "lane-label", x: "12", y: String(laneTop + LANE_H / 2 - 2) });
      label.textContent = lane.name;
      laneLayer.appendChild(label);
      var countText = svgEl("text", { class: "lane-count", x: "12", y: String(laneTop + LANE_H / 2 + 11) });
      countText.textContent = count + " 节点";
      laneLayer.appendChild(countText);
    });
    svg.appendChild(laneLayer);

    var edgeLayer = svgEl("g", { class: "edge-layer" });
    state.nodes.forEach(function (node) {
      if (!node.parent) return;
      var parent = state.byId[node.parent];
      if (!parent) return;
      var x1 = GUTTER + nodeDepth(parent) * COL_PITCH + NODE_W;
      var y1 = TOP + parent.lane * LANE_H + LANE_H / 2;
      var x2 = GUTTER + nodeDepth(node) * COL_PITCH - 5;
      var y2 = TOP + node.lane * LANE_H + LANE_H / 2;
      var mid = x1 + Math.max(14, (x2 - x1) / 2);
      var d = "M" + x1 + " " + y1 + " C" + mid + " " + y1 + " " + mid + " " + y2 + " " + x2 + " " + y2;
      var cls = "edge";
      var marker = "arrow-normal";
      if (node.action === "回退") {
        cls += " is-branch is-rollback";
        marker = "arrow-rollback";
      } else if (node.action === "实验") {
        cls += " is-branch is-experiment";
        marker = "arrow-experiment";
      }
      edgeLayer.appendChild(svgEl("path", {
        class: cls,
        d: d,
        "marker-end": "url(#" + marker + ")"
      }));
    });
    svg.appendChild(edgeLayer);

    var nodeLayer = svgEl("g", { class: "node-layer" });
    state.nodes.forEach(function (node) {
      var isCurrent = node.id === state.currentId;
      var isSelected = node.id === state.selectedId;
      var group = svgEl("g", { class: "tree-node", tabindex: "0", role: "button" });
      group.setAttribute("data-id", node.id);
      group.setAttribute("aria-label", node.rev + " " + node.label + "，" + node.action + "，" + node.messages.length + " 条消息");
      group.setAttribute("aria-pressed", isSelected ? "true" : "false");
      if (isCurrent) group.setAttribute("aria-current", "true");
      if (isCurrent) group.classList.add("is-current");
      if (isSelected) group.classList.add("is-selected");
      if (node.dynamic) group.classList.add("is-dynamic");
      if (node.id === state.newNodeId) group.classList.add("is-new");

      var tip = svgEl("title");
      tip.textContent = node.rev + " · " + node.label + " · " + node.note;
      group.appendChild(tip);

      var x = GUTTER + nodeDepth(node) * COL_PITCH;
      var y = TOP + node.lane * LANE_H + LANE_H / 2;
      group.appendChild(svgEl("rect", {
        class: "node-card",
        x: String(x),
        y: String(y - NODE_H / 2),
        width: String(NODE_W),
        height: String(NODE_H),
        rx: "6",
        ry: "6"
      }));
      group.appendChild(svgEl("rect", {
        class: "node-accent",
        x: String(x + 7),
        y: String(y - NODE_H / 2 + 10),
        width: "3",
        height: String(NODE_H - 20),
        rx: "1.5",
        fill: ACTION_COLOR[node.action] || "#6B7280"
      }));

      var title = svgEl("text", { class: "node-title", x: String(x + 16), y: String(y - 8) });
      title.textContent = node.label;
      group.appendChild(title);

      var meta1 = svgEl("text", { class: "node-meta", x: String(x + 16), y: String(y + 9) });
      meta1.textContent = node.rev + " · " + node.action;
      group.appendChild(meta1);

      var meta2 = svgEl("text", { class: "node-meta", x: String(x + 16), y: String(y + 23) });
      meta2.textContent = node.messages.length + " 条消息";
      group.appendChild(meta2);

      if (isCurrent) {
        var flag = svgEl("text", { class: "node-flag", x: String(x + NODE_W - 1), y: String(y - NODE_H / 2 - 7) });
        flag.textContent = "当前";
        group.appendChild(flag);
      }

      group.addEventListener("click", function () { selectNode(node.id); });
      group.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          selectNode(node.id);
        }
      });
      nodeLayer.appendChild(group);
    });
    svg.appendChild(nodeLayer);
    state.newNodeId = null;
  }

  function refreshSelection() {
    var groups = $("tree").querySelectorAll(".tree-node");
    for (var i = 0; i < groups.length; i++) {
      var group = groups[i];
      var id = group.getAttribute("data-id");
      var selected = id === state.selectedId;
      var current = id === state.currentId;
      group.classList.toggle("is-selected", selected);
      group.classList.toggle("is-current", current);
      group.setAttribute("aria-pressed", selected ? "true" : "false");
      if (current) group.setAttribute("aria-current", "true");
      else group.removeAttribute("aria-current");
    }
  }

  /* ---------- 对话回放 ---------- */

  function appendMessageRow(log, message) {
    var row = el("div", "msg " + message.role);
    row.appendChild(el("p", "msg-role", ROLE_LABEL[message.role] || message.role));
    row.appendChild(el("p", "msg-body", message.text));
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
  }

  function appendPending(log, role) {
    var row = el("div", "msg pending " + role);
    row.appendChild(el("p", "msg-role", ROLE_LABEL[role] || role));
    var body = el("p", "msg-body");
    var dots = el("span", "dots", role === "tool" ? "检索中…" : "输入中…");
    body.appendChild(dots);
    row.appendChild(body);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }

  function playNode(node) {
    var token = ++state.playToken;
    state.armedNode = null;
    if (state.armTimer) {
      clearTimeout(state.armTimer);
      state.armTimer = null;
    }

    var notice = state.noticeText;
    state.noticeText = null;

    var panel = $("replay");
    clear(panel);

    var head = el("div", "replay-head");
    head.appendChild(el("p", "replay-kicker", "SNAPSHOT / " + node.rev));
    head.appendChild(el("h2", "replay-title", node.label));
    head.appendChild(el("p", "replay-stats", "动作 · " + node.action + " ｜ 泳道 " + laneName(node.lane) + " ｜ 父节点 " + parentText(node) + " ｜ " + node.messages.length + " 条消息"));
    if (node.note) head.appendChild(el("p", "replay-note", node.note));
    if (notice) head.appendChild(el("p", "replay-notice", notice));
    if (node.id === state.currentId) head.appendChild(el("span", "replay-chip", "当前快照"));
    panel.appendChild(head);

    var log = el("div", "replay-log");
    log.appendChild(el("p", "replay-loading", "读取快照 " + node.rev + "…"));
    panel.appendChild(log);

    var foot = el("div", "replay-foot");
    var status = el("p", "replay-status", "读取快照 " + node.rev + "…");
    foot.appendChild(status);
    panel.appendChild(foot);

    appendRollbackControl(foot, status, node, token);

    (async function () {
      await sleep(300);
      if (token !== state.playToken) return;
      clear(log);

      var total = node.messages.length;
      for (var i = 0; i < total; i++) {
        var message = node.messages[i];
        var pending = appendPending(log, message.role);
        await sleep(message.role === "tool" ? 600 : rand(450, 700));
        if (token !== state.playToken) return;
        pending.remove();
        appendMessageRow(log, message);
        if (!state.writing) {
          status.textContent = "这是第 " + (i + 1) + " 条 / 共 " + total + " 条";
        }
        log.scrollTop = log.scrollHeight;
      }

      if (token !== state.playToken || state.writing) return;
      status.textContent = "本轮结束";
      status.classList.add("is-done");
    })();
  }

  function appendRollbackControl(foot, status, node, token) {
    if (node.id === state.currentId) return;
    var button = el("button", "rollback-btn", "回退到此节点");
    button.type = "button";
    button.addEventListener("click", function () {
      if (state.writing) return;
      if (state.armedNode !== node.id) {
        state.armedNode = node.id;
        button.textContent = "确认回退";
        button.classList.add("is-armed");
        status.classList.remove("is-done");
        status.textContent = "再点一次确认；回退只新增节点，不删除历史。";
        if (state.armTimer) clearTimeout(state.armTimer);
        state.armTimer = setTimeout(function () {
          if (state.armedNode !== node.id) return;
          state.armedNode = null;
          button.textContent = "回退到此节点";
          button.classList.remove("is-armed");
          if (!status.classList.contains("is-done")) status.textContent = "已取消确认。";
        }, 6000);
        return;
      }
      performRollback(node, button, status, token);
    });
    foot.appendChild(button);
  }

  async function performRollback(target, button, status, token) {
    state.writing = true;
    state.armedNode = null;
    if (state.armTimer) {
      clearTimeout(state.armTimer);
      state.armTimer = null;
    }
    button.disabled = true;
    button.textContent = "写入快照…";
    status.classList.remove("is-done");
    status.textContent = "写入快照…";

    await sleep(600);
    state.writing = false;

    if (state.selectedId !== target.id || token !== state.playToken) return;

    var existing = findRollback(target.id);
    if (existing) {
      state.currentId = existing.id;
      state.selectedId = existing.id;
      updateHeader();
      renderTree();
      state.noticeText = "已存在从 " + target.rev + " 的回退节点，直接切换到该快照。";
      playNode(existing);
      return;
    }

    var depth = nodeDepth(target) + 1;
    var lane = allocateLane(depth);
    var rev = nextRev();
    var node = {
      id: "rollback-" + (++state.dynamicSeq),
      rev: rev,
      label: "回退 · 从 " + target.rev,
      action: "回退",
      messages: cloneMessages(target.messages),
      parent: target.id,
      lane: lane,
      note: "从 " + target.rev + " 回退 · 演示新增，原节点全部保留",
      rollbackFrom: target.id,
      dynamic: true
    };

    state.nodes.push(node);
    state.byId[node.id] = node;
    state.currentId = node.id;
    state.selectedId = node.id;
    state.newNodeId = node.id;
    updateHeader();
    renderTree();
    state.noticeText = "已写入新快照 " + rev + "；原节点全部保留。";
    playNode(node);
  }

  function selectNode(id) {
    if (state.writing) return;
    var node = state.byId[id];
    if (!node) return;
    state.selectedId = id;
    refreshSelection();
    playNode(node);
  }

  /* ---------- 项目切换 ---------- */

  function snapshotRuntime() {
    if (!state.projectId) return;
    state.cache[state.projectId] = {
      nodes: state.nodes,
      lanes: state.lanes,
      currentId: state.currentId,
      dynamicSeq: state.dynamicSeq
    };
  }

  function loadProject(key) {
    if (state.loading || state.writing) return;
    if (state.projectId === key) return;
    var fixture = PROJECT_FIXTURES[key];
    if (!fixture) return;

    snapshotRuntime();

    state.loading = true;
    state.loadToken += 1;
    state.playToken += 1;
    var token = state.loadToken;
    setActiveTab(key);
    renderProjectLoading();
    showLoading(true);
    $("tree").classList.remove("is-visible");

    var wait = 500 + Math.random() * 200;
    sleep(wait).then(function () {
      if (token !== state.loadToken) return;

      var saved = state.cache[key];
      state.projectId = key;
      state.project = fixture;
      if (saved) {
        state.nodes = saved.nodes;
        state.lanes = saved.lanes;
        state.currentId = saved.currentId;
        state.dynamicSeq = saved.dynamicSeq;
      } else {
        state.nodes = cloneNodes(fixture.nodes);
        state.lanes = cloneLanes(fixture.lanes);
        state.currentId = fixture.current;
        state.dynamicSeq = 0;
      }
      state.byId = {};
      state.nodes.forEach(function (node) { state.byId[node.id] = node; });
      state.selectedId = null;
      state.armedNode = null;
      state.writing = false;
      state.newNodeId = null;
      state.noticeText = null;
      if (state.armTimer) {
        clearTimeout(state.armTimer);
        state.armTimer = null;
      }
      state.playToken += 1;

      renderTree();
      updateHeader();
      showLoading(false);
      state.loading = false;

      var tree = $("tree");
      requestAnimationFrame(function () { tree.classList.add("is-visible"); });
      selectNode(state.currentId);
    });
  }

  function bind() {
    $("tab-a").addEventListener("click", function () { loadProject("a"); });
    $("tab-b").addEventListener("click", function () { loadProject("b"); });

    if (!EMBED) {
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") return;
        if (window.history.length > 1) window.history.back();
        else window.location.href = "../chat/index.html";
      });
    }
  }

  bind();
  loadProject("a");
})();
</script>
</body>
