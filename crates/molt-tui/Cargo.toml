[package]
name = "molt-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "molt_tui"
path = "src/lib.rs"

[[bin]]
name = "molt-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
ureq = "3"
