[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "molt"
version = "1.2.0rc9"
description = "Agent 工作流的状态事务、证据审计与恢复"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "molt" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.22",
  "pytest>=8.4",
  "ruff>=0.6",
]

[project.scripts]
molt = "molt.cli:main"

[tool.hatch.build]
# Both artifacts carry the same kernel-facing Python runtime.
exclude = [
  "/molt/adapters", "/molt/demo.py", "/molt/bench.py", "/molt/shell_bundle.py", "/molt/shell_loader.py",
  "/molt/schema.py",
  "/molt/core/archive.py", "/molt/core/audit.py", "/molt/core/engine.py",
  "/molt/core/events.py", "/molt/core/gate.py", "/molt/core/genome.py",
  "/molt/core/isolation.py", "/molt/core/ledger.py", "/molt/core/metrics.py",
  "/molt/core/policy.py", "/molt/core/ports.py", "/molt/core/proposer.py",
  "/molt/core/redact.py", "/molt/core/snapshot.py", "/molt/core/store.py", "/molt/core/types.py",
]

[tool.hatch.build.targets.wheel]
packages = ["molt"]

[tool.hatch.build.targets.sdist]
only-include = [
  "molt", "crates", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
  "pyproject.toml", "uv.lock", "README.md", "README.zh-CN.md", "LICENSE",
  "packaging", "docs/operations", "tests/test_kernel_transactions.py",
  "tests/test_project_cli.py", "tests/test_version_cli.py",
  "examples/project-reader.mjs", "examples/project-workspace.sh",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pi: Pi adapter tests; live calls require explicit opt-in",
  "integration: requires host sandbox/socket capabilities",
]
norecursedirs = ["attic", "bench", "shells", ".venv", "runs", "state"]
addopts = "-p no:cacheprovider"
