[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "molt"
version = "1.1.0"
description = "Agent 工作流的状态事务、证据审计、迁移与恢复"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "molt" }]
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.6",
]

[project.scripts]
molt = "molt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["molt"]
# Runtime package retains the frozen v1 compatibility code, not competition loaders.
exclude = ["/molt/adapters", "/molt/demo.py", "/molt/bench.py", "/molt/shell_bundle.py", "/molt/shell_loader.py"]

[tool.hatch.build.targets.sdist]
# Source distributions follow the same runtime boundary; checkout assets remain pending confirmation.
only-include = ["molt", "schemas", "crates", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "pyproject.toml", "uv.lock", "README.md", "LICENSE", "packaging", "docs/operations", "docs/protocol.md", "tests/test_kernel_client.py", "tests/test_kernel_transactions.py", "tests/test_kernel_cli_contract.py", "tests/test_v1_compatibility.py", "tests/fixtures/records"]
exclude = ["/molt/adapters", "/molt/demo.py", "/molt/bench.py", "/molt/shell_bundle.py", "/molt/shell_loader.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pi: Pi adapter tests; live calls require explicit opt-in",
  "integration: requires host sandbox/socket capabilities",
]
norecursedirs = ["attic", "bench", "shells", ".venv", "runs", "state"]
addopts = "-p no:cacheprovider"
