[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "molt"
version = "1.1.0"
description = "自进化 agent 引擎的外层编排器：协议、门禁、事务与 fixture runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "molt" }]
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "ruff>=0.6",
]

[project.scripts]
molt = "molt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["molt"]

[tool.hatch.build.targets.sdist]
exclude = ["/attic"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["attic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pi: Pi adapter tests; live calls require explicit opt-in",
  "integration: requires host sandbox/socket capabilities",
]
norecursedirs = ["attic", "bench", "shells", ".venv", "runs", "state"]
addopts = "-p no:cacheprovider"
