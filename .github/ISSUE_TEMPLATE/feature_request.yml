name: Feature request / 功能建议
description: Propose a user-facing improvement to molt.
body:
  - type: textarea
    id: workflow
    attributes:
      label: Workflow and problem / 工作流与问题
      description: Describe what you are trying to do and where the current workflow falls short.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / 预期效果
      description: Describe the behavior you would like to see and how you would verify it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 现有做法
      description: Include any relevant alternatives you have tried.
