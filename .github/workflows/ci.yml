name: ci

# 六个作业：lint / schema / boundary / audit / secret-scan / kernel。
# kernel 运行 Rust、UDS 与安装包恢复子集；全量 Python pytest 仍为手动 / 集中执行。
# 真实 Pi 调用不在本工作流内（见 pi-smoke.yml：手动触发，只跑 1 条 live task，
# 费用 cap 为本次单 run 的运行后验收上限）。
#
# 提示：作业名即 `lint`、`schema`、`boundary`、`audit`、`secret-scan`、`kernel`；
# 当前分支保护未登记必需状态检查（见 CONTRIBUTING §九）。
# 3.11 浮点夹具差异见 CONTRIBUTING §九「已知兼容性缺口」：手动全量 pytest 在 3.12 下执行。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor/v2-kernel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装 dev 依赖（lock 必须新鲜）
        run: uv sync --extra dev --locked
      - name: ruff
        run: uv run ruff check .

  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: 记录 schema 校验（11 类 / 仓库内全部记录）
        run: uv run python -m molt schema validate --all
      - name: scenario / genome / bench_hash 一致性
        run: uv run python -m molt scenario validate
      - name: docs/protocol.md 无手改漂移
        run: |
          uv run python -m molt schema docs --output /tmp/protocol.md
          if ! diff -u docs/protocol.md /tmp/protocol.md; then
            echo "::error::docs/protocol.md 与 schema 生成结果不一致；请运行 molt schema docs 重新生成"
            exit 1
          fi

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: core 依赖边界（stdio only）
        run: uv run python -m molt doctor --deps
      - name: 核心不得出现第三方 import（AST 兜底）
        run: |
          uv run python - <<'PY'
          import ast
          import pathlib
          import sys

          stdlib = sys.stdlib_module_names
          bad = []
          for path in sorted(pathlib.Path("molt/core").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          continue
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      if name == "molt.core" or name.startswith("molt.core."):
                          continue
                      root = name.split(".")[0]
                      if root and root not in stdlib:
                          bad.append(f"{path}:{getattr(node, 'lineno', '?')}: {name}")
          if bad:
              print("\n".join(bad))
              sys.exit("molt/core 只允许 stdlib 与 molt.core.*")
          print("boundary ok")
          PY

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: 门禁夹具 G1–G8
        run: uv run python -m molt gate --fixture tests/fixtures/gate/
      - name: 只读重算
        run: uv run python -m molt audit --scenario demo
      - name: demo 闭环（replay 模式：0 live，10 题扫描回放单独成组）
        run: |
          uv run python -m molt demo --mode replay \
            --state /tmp/molt-ci-demo --max-wall 180
      - name: demo 证据重算
        run: uv run python -m molt audit --scenario demo --state /tmp/molt-ci-demo
      - name: 零写入（仓库树不得被命令改动）
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::命令改动了仓库；零写入约定见 AGENTS.md §九"
            exit 1
          fi

  kernel:
    name: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust tests including fault injection
        run: cargo test --workspace --features molt-kernel/fault-injection --quiet
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --features molt-kernel/fault-injection -- -D warnings
      - name: Build debug kernel for UDS integration tests
        run: cargo build -p molt-kernel
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python test dependencies
        run: uv sync --extra dev --locked
      - name: Kernel UDS integration and service lifecycle
        env:
          MOLT_KERNEL_BIN: target/debug/molt-kernel
        run: uv run pytest -q tests/test_kernel_client.py tests/test_kernel_cli_contract.py
      - name: Build Linux x86_64 candidate bundle
        run: packaging/release/build-linux-x86_64.sh /tmp/molt-release
      - name: Smoke extracted wheel and kernel bundle
        run: |
          sha256sum -c /tmp/molt-release/molt-*-linux-x86_64.tar.gz.sha256
          mkdir -p /tmp/molt-bundle-smoke
          tar -xzf /tmp/molt-release/molt-*-linux-x86_64.tar.gz -C /tmp/molt-bundle-smoke
          bundle=$(find /tmp/molt-bundle-smoke -mindepth 1 -maxdepth 1 -type d)
          bash packaging/release/verify-bundle.sh "$bundle" /tmp/molt-bundle-verification
      - uses: actions/upload-artifact@v4
        with:
          name: molt-linux-x86_64-candidate
          path: |
            /tmp/molt-release/molt-*-linux-x86_64.tar.gz
            /tmp/molt-release/molt-*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: 常见凭据形态
        run: |
          set -eu
          patterns=(
            'sk-[A-Za-z0-9]{32,}'
            'gh[pousr]_[A-Za-z0-9]{36}'
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z_-]{35}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            '(DEEPSEEK|OPENAI|ANTHROPIC)_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]$]'
          )
          status=0
          for pattern in "${patterns[@]}"; do
            if rg -n --hidden -g '!.git' -g '!.venv' -e "$pattern" .; then
              echo "::error::secret-scan 命中 /$pattern/"
              status=1
            fi
          done
          exit $status
      - name: 凭据文件不得入库
        run: |
          if rg --files --hidden -g '!.git' -g '.env' -g '.env.*' -g '!.env.example' | grep -q .; then
            echo "::error::发现被提交的 .env 文件"
            exit 1
          fi
          echo "no credential files"
