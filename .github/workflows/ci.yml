name: ci

# 六个作业：lint / schema / boundary / audit / secret-scan / kernel。
# 仅 synthetic 协议与事务验证，不访问模型 API 或校园系统。
# kernel 包含 Rust 故障注入、真实 UDS 与仓库外安装包验证。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, refactor/v2-kernel]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: 安装 dev 依赖（lock 必须新鲜）
        run: uv sync --extra dev --locked
      - name: ruff
        run: uv run ruff check .

  schema:
    name: schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: 记录 schema 校验（11 类 / 仓库内全部记录）
        run: uv run python -m molt.schema validate --all
      - name: 历史 v1 schema 样例校验
        run: uv run pytest -q tests/test_schema_compat.py tests/test_schema_docs_output.py
      - name: docs/protocol.md 无手改漂移
        run: |
          uv run python -m molt.schema docs --output /tmp/protocol.md
          if ! diff -u docs/protocol.md /tmp/protocol.md; then
            echo "::error::docs/protocol.md 与 schema 生成结果不一致；请运行 python -m molt.schema docs 重新生成"
            exit 1
          fi

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: core 依赖边界（stdio only）
        run: uv run python -m molt doctor --deps
      - name: 核心不得出现第三方 import（AST 兜底）
        run: |
          uv run python - <<'PY'
          import ast
          import pathlib
          import sys

          stdlib = sys.stdlib_module_names
          bad = []
          for path in sorted(pathlib.Path("molt/core").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:
                          continue
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      if name == "molt.core" or name.startswith("molt.core."):
                          continue
                      root = name.split(".")[0]
                      if root and root not in stdlib:
                          bad.append(f"{path}:{getattr(node, 'lineno', '?')}: {name}")
          if bad:
              print("\n".join(bad))
              sys.exit("molt/core 只允许 stdlib 与 molt.core.*")
          print("boundary ok")
          PY

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --extra dev --locked
      - name: 构建 synthetic audit 使用的 kernel
        run: cargo build -p molt-kernel
      - name: Kernel 事务恢复和旧入口拒绝
        env:
          MOLT_KERNEL_BIN: target/debug/molt-kernel
        run: uv run pytest -q tests/test_kernel_transactions.py
      - name: 零写入（文件系统树快照）
        env:
          MOLT_KERNEL_BIN: target/debug/molt-kernel
        run: uv run pytest -q tests/test_zero_write.py

  kernel:
    name: kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Rust tests including fault injection
        run: cargo test --workspace --features molt-kernel/fault-injection --quiet
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --features molt-kernel/fault-injection -- -D warnings
      - name: Build debug kernel for UDS integration tests
        run: cargo build -p molt-kernel
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python test dependencies
        run: uv sync --extra dev --locked
      - name: Kernel UDS integration and service lifecycle
        env:
          MOLT_KERNEL_BIN: target/debug/molt-kernel
        run: uv run pytest -q tests/test_kernel_client.py tests/test_kernel_cli_contract.py tests/test_kernel_transactions.py
      - name: Build kernel for project CLI recovery tests
        run: cargo build -p molt-kernel --features fault-injection
      - name: Project CLI pinned reads, dirty edits and request recovery
        env:
          MOLT_KERNEL_BIN: target/debug/molt-kernel
          PYTHONDONTWRITEBYTECODE: "1"
        run: uv run pytest -q tests/test_project_cli.py
      - name: Build Linux x86_64 candidate bundle
        run: packaging/release/build-linux-x86_64.sh /tmp/molt-release
      - name: Smoke extracted wheel and kernel bundle
        run: |
          sha256sum -c /tmp/molt-release/molt-*-linux-x86_64.tar.gz.sha256
          mkdir -p /tmp/molt-bundle-smoke
          tar -xzf /tmp/molt-release/molt-*-linux-x86_64.tar.gz -C /tmp/molt-bundle-smoke
          bundle=$(find /tmp/molt-bundle-smoke -mindepth 1 -maxdepth 1 -type d)
          sdist=$(find /tmp/molt-release -maxdepth 1 -name 'molt-*.tar.gz' ! -name '*-linux-x86_64.tar.gz')
          bash packaging/release/verify-bundle.sh "$bundle" /tmp/molt-bundle-verification "$sdist"
      - uses: actions/upload-artifact@v4
        with:
          name: molt-linux-x86_64-candidate
          path: |
            /tmp/molt-release/molt-*-linux-x86_64.tar.gz.sha256
            /tmp/molt-release/molt-*.tar.gz
          if-no-files-found: error

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 ripgrep
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)
      - name: 常见凭据形态
        run: |
          set -eu
          patterns=(
            'sk-[A-Za-z0-9]{32,}'
            'gh[pousr]_[A-Za-z0-9]{36}'
            'AKIA[0-9A-Z]{16}'
            'AIza[0-9A-Za-z_-]{35}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'
            '(DEEPSEEK|OPENAI|ANTHROPIC)_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]$]'
          )
          status=0
          for pattern in "${patterns[@]}"; do
            if rg -n --hidden -g '!.git' -g '!.venv' -e "$pattern" .; then
              echo "::error::secret-scan 命中 /$pattern/"
              status=1
            fi
          done
          exit $status
      - name: 凭据文件不得入库
        run: |
          if rg --files --hidden -g '!.git' -g '.env' -g '.env.*' -g '!.env.example' | grep -q .; then
            echo "::error::发现被提交的 .env 文件"
            exit 1
          fi
          echo "no credential files"
